plugins {
 id 'net.fabricmc.fabric-loom' version '1.17.21'
 id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'mpsq-team' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
 implementation files('libs/mcef-modern-0.3.3+mc26.3.jcef146.0.10.jar')
 implementation 'me.friwi:jcef-api:jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179'
}
loom {
 splitEnvironmentSourceSets()
 mods { mpsqcamera { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }

// Opt-in isolated client smoke test; never included in the distributable build.
if (project.hasProperty('portSmoke')) {
 sourceSets.client.java.srcDir 'checks/smoke/java'
 processResources.doLast {
  def manifest = file("${destinationDir}/fabric.mod.json")
  def json = new groovy.json.JsonSlurper().parse(manifest)
  json.entrypoints['fabric-client-gametest'] = ['de.galaxushd.mpsqcamera.PortSmokeTest']
  manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
 }
 loom.runs.client { vmArg '-Dfabric.client.gametest=true'; vmArg '-Dfabric.client.gametest.modid=mpsqcamera' }
}
processResources.inputs.property 'portSmoke', project.hasProperty('portSmoke')

// Isolated camera editor regression test, never included in a normal build.
if (project.hasProperty('cinematicSmoke')) {
 sourceSets.client.java.srcDir 'checks/cinematic-smoke/java'
 processResources.doLast {
  def manifest = file("${destinationDir}/fabric.mod.json")
  def json = new groovy.json.JsonSlurper().parse(manifest)
  json.entrypoints['fabric-client-gametest'] = ['de.galaxushd.mpsqcamera.CinematicGuiSmoke']
  manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
 }
 loom.runs.client { vmArg '-Dfabric.client.gametest=true'; vmArg '-Dfabric.client.gametest.modid=mpsqcamera' }
}
processResources.inputs.property 'cinematicSmoke', project.hasProperty('cinematicSmoke')
